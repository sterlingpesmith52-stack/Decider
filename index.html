<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decider</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    padding-bottom: 90px;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #000;
}

.logo {
    width: 70px;
    height: auto;
    display: block;
    margin-bottom: 10px;
}

h1 {
    font-size: 32px;
    font-weight: 600;
    margin: 0 0 25px 20px;
    text-align: left;
}

.tagline {
    font-size: 20px;
    line-height: 1.4;
    margin-bottom: 25px;
}

.label {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 12px;
}

textarea {
    width: 100%;
    min-height: 180px;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
}

.button-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    margin-bottom: 24px;
}

button {
    width: auto;
    padding: 6px 12px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
}

.primary-button {
    background: #fff;
    color: #000;
    border: 2px solid #2563eb;
}

.secondary-button {
    background: #000;
    color: #fff;
    border: 2px solid #000;
}

.result-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 18px;
}

.result-label {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
}

.result-placeholder {
    font-size: 15px;
    color: #777;
}

.result-value {
    font-size: 28px;
    font-weight: 700;
    color: #000;
}

.footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #fff;
    border-top: 1px solid #ddd;
    padding: 12px;
}

.buy-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: #000;
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
}
</style>
</head>

<body>

IMG_1741.jpeg

<h1>Decider</h1>

<div class="tagline">
    Can't agree? Let Decider choose.
</div>

<div class="label">
    What are you choosing between?
</div>

<textarea id="choices" placeholder="Pizza
Mexican
Chinese
Burgers"></textarea>

<div class="button-row">
    <button class="primary-button" onclick="chooseForMe()">
        Choose For Me
    </button>

    <button class="secondary-button" onclick="clearChoices()">
        Clear
    </button>
</div>

<div class="result-card">
    <div class="result-label">My Choice</div>

    <div id="result" class="result-placeholder">
        —
    </div>
</div>

<div class="footer">
    YOUR_PURCHASE_URL
        Buy This Tool
    </a>
</div>

<script>
function chooseForMe() {
    const text = document.getElementById('choices').value;

    const choices = text
        .split('\n')
        .map(choice => choice.trim())
        .filter(choice => choice.length > 0);

    if (choices.length < 2) {
        document.getElementById('result').className = 'result-placeholder';
        document.getElementById('result').textContent =
            'Enter at least two choices.';
        return;
    }

    const randomIndex = Math.floor(Math.random() * choices.length);

    document.getElementById('result').className = 'result-value';
    document.getElementById('result').textContent =
        choices[randomIndex];
}

function clearChoices() {
    document.getElementById('choices').value = '';

    document.getElementById('result').className = 'result-placeholder';
    document.getElementById('result').textContent = '—';
}
</script>

</body>
</html>
